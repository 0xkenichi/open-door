# Optional mirror of the web app on GitHub Pages. Run manually from the Actions tab.
# The primary host is web4: the contract serves web/ at https://opendoor-door-vw50k1.testnet.page.
# One-time setup once the repo is public: Settings → Pages → Source: GitHub Actions.
name: Deploy web app to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
